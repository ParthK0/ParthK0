<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <defs>
    <!-- Font Imports & CSS -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');

      .footer-title {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #0F172A;
        letter-spacing: -0.5px;
      }

      .footer-title-purple {
        fill: url(#purpleGradient);
      }

      .footer-title-cyan {
        fill: url(#cyanGradient);
      }

      .footer-subtitle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #475569;
      }

      .pill-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #1E293B;
      }

      .bottom-thankyou {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #FFFFFF;
        opacity: 0.95;
      }

      /* 🌟 Wave Flow Animations */
      .footer-wave-1 {
        animation: flowFooterWave1 14s linear infinite;
      }
      .footer-wave-2 {
        animation: flowFooterWave2 20s linear infinite;
      }

      @keyframes flowFooterWave1 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-90px); }
        100% { transform: translateX(0px); }
      }
      @keyframes flowFooterWave2 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(110px); }
        100% { transform: translateX(0px); }
      }

      /* Floating Rocket Animation */
      .floating-rocket {
        animation: floatRocket 4s ease-in-out infinite alternate;
      }
      @keyframes floatRocket {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-8px) rotate(4deg); }
      }

      /* Twinkling Stars */
      .twinkle-star {
        animation: twinkle 3s ease-in-out infinite alternate;
      }
      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1.2); }
      }

      a { cursor: pointer; text-decoration: none; }
      a:hover rect { fill: #F1F5F9; }
    </style>

    <!-- Gradients -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>

    <linearGradient id="footerWaveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1D4ED8;stop-opacity:0.95"/>
      <stop offset="40%" style="stop-color:#4338CA;stop-opacity:0.9"/>
      <stop offset="75%" style="stop-color:#6D28D9;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:0.9"/>
    </linearGradient>

    <linearGradient id="footerWaveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.45"/>
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0.5"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="pillShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#475569" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <pattern id="dotGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#94A3B8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" fill="#F8FAFC" rx="16"/>

  <!-- Left & Right Grid Patterns -->
  <rect x="20" y="160" width="80" height="96" fill="url(#dotGrid)" opacity="0.6"/>
  <rect x="900" y="160" width="80" height="96" fill="url(#dotGrid)" opacity="0.6"/>

  <!-- Twinkling Sparkle Stars -->
  <g fill="#8B5CF6">
    <path class="twinkle-star" d="M440 60 L442 66 L448 68 L442 70 L440 76 L438 70 L432 68 L438 66 Z" transform="scale(0.8) translate(100, 10)"/>
    <path class="twinkle-star" d="M560 50 L561 54 L565 55 L561 56 L560 60 L559 56 L555 55 L559 54 Z" transform="scale(0.8) translate(0, 10)" style="animation-delay: 1s;"/>
    <path class="twinkle-star" d="M520 80 L521 83 L524 84 L521 85 L520 88 L519 85 L516 84 L519 83 Z" style="animation-delay: 2s;"/>
  </g>

  <!-- Top Rocket Icon with Floating Animation -->
  <g transform="translate(500, 75)" class="floating-rocket">
    <line x1="-140" y1="12" x2="-30" y2="12" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-140" cy="12" r="3" fill="#6366F1"/>
    
    <line x1="30" y1="12" x2="140" y2="12" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="140" cy="12" r="3" fill="#06B6D4"/>

    <g transform="translate(-16, -16)">
      <path d="M16 2 C16 2 2 10 0 22 C6 22 12 28 12 28 C12 28 22 26 30 12 C30 4 28 0 28 0 C28 0 24 2 16 2 Z" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="10" r="3" fill="#4F46E5"/>
      <path d="M6 20 L0 32 L8 26" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Main Title: Let's build something intelligent together. -->
  <g transform="translate(500, 160)" text-anchor="middle">
    <text x="0" y="0" class="footer-title">
      Let’s build something <tspan class="footer-title-purple">intelligent</tspan> <tspan class="footer-title-cyan">together.</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(500, 202)" text-anchor="middle">
    <text x="0" y="0" class="footer-subtitle">
      <tspan fill="#6366F1" font-weight="700">&lt;</tspan> &nbsp; Always learning. Always building. Always improving. &nbsp; <tspan fill="#06B6D4" font-weight="700">&gt;</tspan>
    </text>
  </g>

  <!-- 4 Contact / Social Pill Buttons Row with Links -->
  <g transform="translate(500, 260)">

    <!-- Button 1: LinkedIn -->
    <a href="https://www.linkedin.com/in/parth-khowal-a37903294/" target="_blank">
      <g transform="translate(-320, 0)">
        <rect width="140" height="46" rx="23" fill="#FFFFFF" filter="url(#pillShadow)"/>
        <rect x="16" y="13" width="20" height="20" rx="4" fill="#0A66C2"/>
        <text x="22" y="27" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">in</text>
        <text x="44" y="28" class="pill-text">/parth-khowal</text>
      </g>
    </a>

    <!-- Connecting Dot 1 -->
    <g transform="translate(-165, 23)">
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#6366F1"/>
    </g>

    <!-- Button 2: Email -->
    <a href="mailto:parthkhowal222@gmail.com">
      <g transform="translate(-150, 0)">
        <rect width="220" height="46" rx="23" fill="#FFFFFF" filter="url(#pillShadow)"/>
        <rect x="14" y="15" width="20" height="15" rx="3" fill="none" stroke="#6366F1" stroke-width="2"/>
        <path d="M14 18 L24 25 L34 18" stroke="#6366F1" stroke-width="2" stroke-linecap="round" fill="none"/>
        <text x="42" y="28" class="pill-text">parthkhowal222@gmail.com</text>
      </g>
    </a>

    <!-- Connecting Dot 2 -->
    <g transform="translate(85, 23)">
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#8B5CF6"/>
    </g>

    <!-- Button 3: GitHub -->
    <a href="https://github.com/ParthK0" target="_blank">
      <g transform="translate(100, 0)">
        <rect width="126" height="46" rx="23" fill="#FFFFFF" filter="url(#pillShadow)"/>
        <circle cx="30" cy="23" r="10" fill="#0F172A"/>
        <path d="M26 25 C26 22 28 19 30 19 C32 19 34 22 34 25 C34 27 33 29 30 29 C27 29 26 27 26 25 Z M28 22 C28 22 29 21 30 21 C31 21 32 22 32 22" fill="#FFFFFF"/>
        <text x="48" y="28" class="pill-text">/ParthK0</text>
      </g>
    </a>

    <!-- Connecting Dot 3 -->
    <g transform="translate(241, 23)">
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#06B6D4"/>
    </g>

    <!-- Button 4: Let's Connect! -->
    <a href="https://www.linkedin.com/in/parth-khowal-a37903294/" target="_blank">
      <g transform="translate(255, 0)">
        <rect width="150" height="46" rx="23" fill="#FFFFFF" filter="url(#pillShadow)"/>
        <circle cx="28" cy="23" r="9" fill="none" stroke="#0D9488" stroke-width="2"/>
        <line x1="19" y1="23" x2="37" y2="23" stroke="#0D9488" stroke-width="1.5"/>
        <ellipse cx="28" cy="23" rx="4" ry="9" fill="none" stroke="#0D9488" stroke-width="1.5"/>
        <text x="44" y="28" class="pill-text">Let's Connect!</text>
      </g>
    </a>

  </g>

  <!-- 🌊 Continuous Animated Layered Waves & Footer Text -->
  <g transform="translate(0, 330)">
    <path class="footer-wave-2" d="M-200,50 C50,10 250,90 500,40 C750,-10 950,70 1200,30 L1200,150 L-200,150 Z" fill="url(#footerWaveGrad2)"/>
    <path class="footer-wave-1" d="M-200,70 C150,30 380,90 650,50 C850,10 1000,75 1200,45 L1200,150 L-200,150 Z" fill="url(#footerWaveGrad1)"/>

    <g transform="translate(500, 115)" text-anchor="middle">
      <path d="M-6 -2 C-9 -5 -13 -2 -11 2 C-9 6 0 11 0 11 C0 11 9 6 11 2 C13 -2 9 -5 6 -2 C4 0 0 3 0 3 C0 3 -4 0 -6 -2 Z" fill="none" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-185, -12) scale(0.85)"/>
      <text x="0" y="0" class="bottom-thankyou">
        Thanks for stopping by! Have a <tspan font-weight="700" fill="#67E8F9">great day</tspan> ahead! 🚀
      </text>
    </g>
  </g>

</svg>
