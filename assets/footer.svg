<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150">
  <defs>
    <!-- CSS Fonts & Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Fira+Code:wght@600;700&amp;display=swap');

      .contact-text {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 16.5px;
        fill: #F8FAFC;
        letter-spacing: -0.3px;
        transition: fill 0.2s ease;
      }

      .tagline-text {
        font-family: 'Fira Code', 'Consolas', monospace;
        font-weight: 700;
        font-size: 14.5px;
        fill: #94A3B8;
        letter-spacing: 0.5px;
      }

      .purple-highlight {
        font-weight: 800;
        fill: #C084FC;
        filter: drop-shadow(0 0 6px rgba(192, 132, 252, 0.5));
      }

      /* Interactive Hover */
      .contact-item {
        cursor: pointer;
      }
      .contact-item:hover .contact-text {
        fill: #38BDF8;
      }
      .contact-item:hover .in-bg {
        fill: #0284C7;
      }
      .contact-item:hover .gh-bg {
        fill: #334155;
      }

      /* Animations */
      .twinkle-star {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.85); }
        100% { opacity: 1; transform: scale(1.25); }
      }

      .astronaut-hover {
        animation: floatAstro 4s ease-in-out infinite alternate;
      }
      @keyframes floatAstro {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }

      .arm-wave {
        transform-origin: 948px 58px;
        animation: wave 2.2s ease-in-out infinite;
      }
      @keyframes wave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(18deg); }
      }
    </style>

    <!-- Gradients for Dark Theme -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F19"/>
      <stop offset="45%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E1B4B;stop-opacity:0.95"/>
    </linearGradient>

    <linearGradient id="moonGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>

    <linearGradient id="visorGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="1000" height="150" rx="14" fill="url(#bgGradDark)" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="20" y1="1" x2="980" y2="1" stroke="#334155" stroke-width="1.2" opacity="0.6"/>

  <!-- ==================== BACKGROUND ART ==================== -->

  <!-- Left Moon (Bottom-Left Corner) -->
  <g transform="translate(-15, 20)">
    <circle cx="65" cy="140" r="70" fill="url(#moonGradDark)" stroke="#475569" stroke-width="1" opacity="0.85"/>
    <circle cx="48" cy="115" r="9" fill="#0F172A" opacity="0.5"/>
    <circle cx="82" cy="128" r="6.5" fill="#0F172A" opacity="0.45"/>
    <circle cx="40" cy="142" r="5" fill="#0F172A" opacity="0.45"/>
    <circle cx="74" cy="155" r="11" fill="#0F172A" opacity="0.45"/>
  </g>

  <!-- Right Moon (Bottom-Right Corner) -->
  <g transform="translate(10, 15)">
    <circle cx="930" cy="145" r="75" fill="url(#moonGradDark)" stroke="#475569" stroke-width="1" opacity="0.9"/>
    <circle cx="896" cy="122" r="9.5" fill="#0F172A" opacity="0.55"/>
    <circle cx="928" cy="158" r="13" fill="#0F172A" opacity="0.5"/>
    <circle cx="958" cy="128" r="7" fill="#0F172A" opacity="0.5"/>
  </g>

  <!-- Twinkling Stars / Sparkles -->
  <g class="twinkle-star" transform="translate(25, 25)">
    <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="#38BDF8"/>
  </g>
  <g class="twinkle-star" transform="translate(64, 60)" style="animation-delay: 1.2s;">
    <path d="M 0,-4.5 Q 0,0 4.5,0 Q 0,0 0,4.5 Q 0,0 -4.5,0 Q 0,0 0,-4.5 Z" fill="#818CF8"/>
  </g>
  <g class="twinkle-star" transform="translate(38, 114)" style="animation-delay: 2.1s;">
    <path d="M 0,-3.5 Q 0,0 3.5,0 Q 0,0 0,3.5 Q 0,0 -3.5,0 Q 0,0 0,-3.5 Z" fill="#22D3EE"/>
  </g>
  <g class="twinkle-star" transform="translate(982, 38)" style="animation-delay: 1.6s;">
    <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="#38BDF8"/>
  </g>
  <g class="twinkle-star" transform="translate(884, 22)" style="animation-delay: 0.6s;">
    <path d="M 0,-4.5 Q 0,0 4.5,0 Q 0,0 0,4.5 Q 0,0 -4.5,0 Q 0,0 0,-4.5 Z" fill="#C084FC"/>
  </g>

  <!-- ==================== CUTE ASTRONAUT ==================== -->
  <g class="astronaut-hover">
    <!-- Heart Bubble -->
    <g transform="translate(892, 34)">
      <circle cx="8" cy="8" r="9" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <circle cx="15" cy="16" r="2" fill="#0F172A"/>
      <circle cx="18" cy="19" r="1.2" fill="#0F172A"/>
      <!-- Glowing Cyan Heart inside -->
      <path d="M 8,11.5 L 5.5,9 C 4.8,8.3 4.8,7.2 5.5,6.5 C 6.2,5.8 7.3,5.8 8,6.5 C 8.7,5.8 9.8,5.8 10.5,6.5 C 11.2,7.2 11.2,8.3 10.5,9 Z" fill="#38BDF8"/>
    </g>

    <!-- Backpack -->
    <rect x="913" y="58" width="9" height="22" rx="3.5" fill="#334155" stroke="#818CF8" stroke-width="1.6"/>

    <!-- Suit Body -->
    <rect x="918" y="60" width="24" height="24" rx="7" fill="#F8FAFC" stroke="#818CF8" stroke-width="2"/>
    <rect x="924" y="66" width="12" height="9" rx="2.5" fill="#0F172A"/>
    <circle cx="928" cy="70" r="1.8" fill="#38BDF8"/>
    <circle cx="933" cy="70" r="1.3" fill="#22D3EE"/>

    <!-- Left Leg dangling down -->
    <path d="M 922,82 L 918,97 L 910,96" fill="none" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 922,82 L 918,97 L 910,96" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="909" cy="96" rx="3.5" ry="2.5" fill="#1E1B4B"/>

    <!-- Right Leg dangling down -->
    <path d="M 938,82 L 942,97 L 950,96" fill="none" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 938,82 L 942,97 L 950,96" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="951" cy="96" rx="3.5" ry="2.5" fill="#1E1B4B"/>

    <!-- Helmet -->
    <circle cx="930" cy="46" r="16" fill="#F8FAFC" stroke="#818CF8" stroke-width="2"/>
    <!-- Visor -->
    <path d="M 920,46 C 920,38 940,38 940,46 C 940,52 920,52 920,46 Z" fill="url(#visorGradDark)"/>
    <path d="M 923,43 C 926,40 932,40 935,42 C 933,44 927,44 923,43 Z" fill="#FFFFFF" opacity="0.85"/>
    <!-- Helmet Ear Collars -->
    <circle cx="914" cy="46" r="2.5" fill="#38BDF8"/>
    <circle cx="946" cy="46" r="2.5" fill="#38BDF8"/>

    <!-- Left Arm -->
    <path d="M 919,65 L 912,73" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
    <path d="M 919,65 L 912,73" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Arm (Waving) -->
    <g class="arm-wave">
      <path d="M 941,65 L 950,54" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
      <path d="M 941,65 L 950,54" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="951" cy="52" r="3" fill="#F8FAFC" stroke="#818CF8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ==================== MAIN CONTENT (CENTERED) ==================== -->

  <!-- Top Row: Social & Contact Links -->
  <g transform="translate(0, 48)">

    <!-- LinkedIn Badge -->
    <a href="https://www.linkedin.com/in/parth-khowal-a37903294/" target="_blank" class="contact-item">
      <g transform="translate(180, 0)">
        <rect class="in-bg" x="0" y="-17" width="28" height="28" rx="6.5" fill="#0A66C2"/>
        <text x="6" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">in</text>
        <text x="36" y="3" class="contact-text">/parth-khowal</text>
      </g>
    </a>

    <!-- Divider 1 -->
    <line x1="372" y1="-14" x2="372" y2="12" stroke="#334155" stroke-width="1.2"/>

    <!-- Email Badge -->
    <a href="mailto:parthkhowal222@gmail.com" class="contact-item">
      <g transform="translate(412, 0)">
        <rect x="0" y="-15" width="28" height="22" rx="5" fill="none" stroke="#818CF8" stroke-width="2.2"/>
        <path d="M 1,-13 L 14,-3 L 27,-13" fill="none" stroke="#818CF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="3" class="contact-text">parthkhowal222@gmail.com</text>
      </g>
    </a>

    <!-- Divider 2 -->
    <line x1="686" y1="-14" x2="686" y2="12" stroke="#334155" stroke-width="1.2"/>

    <!-- GitHub Badge -->
    <a href="https://github.com/ParthK0" target="_blank" class="contact-item">
      <g transform="translate(720, 0)">
        <circle class="gh-bg" cx="13" cy="-3" r="13" fill="#1E293B"/>
        <path d="M 13,-12 C 7.5,-12 3,-7.5 3,-2 C 3,2.4 5.9,6.1 9.8,7.4 C 10.3,7.5 10.5,7.2 10.5,6.9 C 10.5,6.7 10.5,6 10.5,5.1 C 7.7,5.7 7.1,3.8 7.1,3.8 C 6.7,2.7 6,2.4 6,2.4 C 5.1,1.8 6.1,1.8 6.1,1.8 C 7.1,1.9 7.6,2.9 7.6,2.9 C 8.5,4.4 9.9,4 10.5,3.7 C 10.6,3 10.9,2.5 11.2,2.2 C 9,1.9 6.7,1.1 6.7,-2.7 C 6.7,-3.8 7.1,-4.7 7.7,-5.4 C 7.6,-5.7 7.3,-6.7 7.8,-8 C 7.8,-8 8.7,-8.3 10.6,-7 C 11.4,-7.2 12.3,-7.3 13.2,-7.3 C 14.1,-7.3 15,-7.2 15.8,-7 C 17.7,-8.3 18.6,-8 18.6,-8 C 19.1,-6.7 18.8,-5.7 18.7,-5.4 C 19.3,-4.7 19.7,-3.8 19.7,-2.7 C 19.7,1.1 17.4,1.9 15.2,2.2 C 15.6,2.5 15.9,3.1 15.9,4.1 C 15.9,5.5 15.9,6.6 15.9,6.9 C 15.9,7.2 16.1,7.5 16.6,7.4 C 20.5,6.1 23.4,2.4 23.4,-2 C 23.4,-7.5 18.9,-12 13,-12 Z" fill="#FFFFFF"/>
        <text x="34" y="3" class="contact-text">/ParthK0</text>
      </g>
    </a>

  </g>

  <!-- Bottom Row: Tagline & Decorative Dot-Lines -->
  <g transform="translate(0, 110)">
    
    <!-- Left Line & Dot -->
    <circle cx="150" cy="0" r="3" fill="#38BDF8"/>
    <line x1="156" y1="0" x2="345" y2="0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tagline Text -->
    <text x="500" y="5" text-anchor="middle" class="tagline-text">
      Code. Coffee. Chaos. <tspan class="purple-highlight">Repeat.</tspan> &#128640;
    </text>

    <!-- Right Line & Dot -->
    <line x1="655" y1="0" x2="844" y2="0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="850" cy="0" r="3" fill="#38BDF8"/>

  </g>

</svg>
