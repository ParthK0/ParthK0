<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
  <defs>
    <linearGradient id="ftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f75c7e"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <filter id="ftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
      .ft-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #4a4a6a;
      }
      .ft-tagline {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #6a6a8a;
      }
      .ft-heart {
        fill: #f75c7e;
        animation: heartbeat 2s ease-in-out infinite;
      }
      .ft-star {
        fill: #f59e0b;
        opacity: 0.6;
        animation: twinkle 3s ease-in-out infinite;
      }
      .ft-star-2 {
        fill: #f59e0b;
        opacity: 0.4;
        animation: twinkle 3s ease-in-out 1s infinite;
      }
      @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.15); }
        30% { transform: scale(1); }
        45% { transform: scale(1.1); }
        60% { transform: scale(1); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Fade-in background -->
  <rect width="900" height="160" fill="url(#ftBg)"/>

  <!-- Top gradient line -->
  <line x1="150" y1="20" x2="750" y2="20" stroke="url(#ftGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Center content -->
  <text x="450" y="70" text-anchor="middle" class="ft-tagline">
    Crafted with
  </text>
  
  <!-- Heart icon -->
  <g transform="translate(508, 56)" class="ft-heart">
    <path d="M7.5 0C5.5 0 3.7 1.1 2.8 2.7 3.7 1.1 5.5 0 7.5 0Z" fill="none"/>
    <path d="M0 5.2C0 2.3 2.3 0 5 0C6.7 0 8.2 0.9 9 2.2C9.8 0.9 11.3 0 13 0C15.7 0 18 2.3 18 5.2C18 11.4 9 16 9 16S0 11.4 0 5.2Z" transform="scale(0.7)"/>
  </g>
  
  <text x="450" y="70" text-anchor="middle" class="ft-tagline">
    Crafted with      by Parth Khowal
  </text>

  <!-- Code-style bottom text -->
  <text x="450" y="100" text-anchor="middle" class="ft-code">
    // AI · ML · Full-Stack · Open Source
  </text>

  <!-- Star decorations -->
  <g transform="translate(280, 62)">
    <polygon points="4,0 5.2,3 8,3 5.8,5 6.5,8 4,6.2 1.5,8 2.2,5 0,3 2.8,3" class="ft-star" transform="scale(0.6)"/>
  </g>
  <g transform="translate(610, 58)">
    <polygon points="4,0 5.2,3 8,3 5.8,5 6.5,8 4,6.2 1.5,8 2.2,5 0,3 2.8,3" class="ft-star-2" transform="scale(0.5)"/>
  </g>

  <!-- Bottom gradient line -->
  <line x1="250" y1="120" x2="650" y2="120" stroke="url(#ftGrad)" stroke-width="0.5" opacity="0.2"/>
  
  <text x="450" y="145" text-anchor="middle" class="ft-code" style="fill:#3a3a5a;font-size:10px;">
    ⭐ If you find my work interesting, consider giving a star ⭐
  </text>
</svg>
