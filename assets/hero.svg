<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280">
  <defs>
    <!-- Font Imports & Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=Space+Grotesk:wght@600;700;800&amp;display=swap');

      .title-parth {
        font-family: 'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 88px;
        fill: #F8FAFC;
        letter-spacing: -2px;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
      }

      .title-khowal {
        font-family: 'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 88px;
        fill: url(#khowalGradientDark);
        letter-spacing: -2px;
        filter: drop-shadow(0 4px 16px rgba(99, 102, 241, 0.35));
      }

      .symbol-text {
        font-family: 'Plus Jakarta Sans', 'Space Grotesk', sans-serif;
        font-weight: 800;
        font-size: 26px;
        fill: #38BDF8;
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
      }

      /* 🌟 Continuous Wave Animations */
      .wave-layer-1 {
        animation: flowWave1 14s linear infinite;
      }
      .wave-layer-2 {
        animation: flowWave2 20s linear infinite;
      }
      .wave-layer-3 {
        animation: flowWave3 26s linear infinite;
      }

      @keyframes flowWave1 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-100px); }
        100% { transform: translateX(0px); }
      }
      @keyframes flowWave2 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(120px); }
        100% { transform: translateX(0px); }
      }
      @keyframes flowWave3 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-140px); }
        100% { transform: translateX(0px); }
      }

      /* Rotating Background Circuit Rings */
      .rotating-ring {
        transform-origin: 1040px 60px;
        animation: spinRing 32s linear infinite;
      }
      @keyframes spinRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Glowing / Pulsing Sparkles */
      .glowing-dot {
        animation: pulseDot 3s ease-in-out infinite alternate;
      }
      @keyframes pulseDot {
        0% { opacity: 0.3; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.4); }
      }

      /* Shimmer Highlight Sweep */
      .shimmer-line {
        animation: shimmerSweep 6s linear infinite;
      }
      @keyframes shimmerSweep {
        0% { transform: translateX(-450px); }
        100% { transform: translateX(1300px); }
      }
    </style>

    <!-- Sleek Dark Background Gradient -->
    <linearGradient id="bgDarkShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F19"/>
      <stop offset="50%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E1B4B;stop-opacity:0.95"/>
    </linearGradient>

    <!-- High-Vibrancy Dark Theme Gradients -->
    <linearGradient id="khowalGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="35%" style="stop-color:#818CF8"/>
      <stop offset="70%" style="stop-color:#C084FC"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>

    <linearGradient id="blueOrbGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1E1B4B;stop-opacity:0.1"/>
    </linearGradient>

    <linearGradient id="waveGrad1Dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1D4ED8;stop-opacity:0.95"/>
      <stop offset="40%" style="stop-color:#4338CA;stop-opacity:0.9"/>
      <stop offset="75%" style="stop-color:#6D28D9;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:0.9"/>
    </linearGradient>

    <linearGradient id="waveGrad2Dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#818CF8;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0.45"/>
    </linearGradient>

    <linearGradient id="waveGrad3Dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#C084FC;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#67E8F9;stop-opacity:0.25"/>
    </linearGradient>

    <linearGradient id="shimmerGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.08)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="orbGlowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dots Pattern for Dark Theme -->
    <pattern id="dotGridDark" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#475569" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="280" fill="url(#bgDarkShade)" rx="20" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Background Grid Patterns -->
  <rect x="24" y="20" width="140" height="120" fill="url(#dotGridDark)" opacity="0.75"/>
  <rect x="970" y="20" width="100" height="120" fill="url(#dotGridDark)" opacity="0.75"/>

  <!-- Left Side Glowing Orb -->
  <circle cx="-10" cy="110" r="90" fill="url(#blueOrbGradDark)" filter="url(#orbGlowDark)"/>

  <!-- Top Right Rotating Concentric Rings & Circuit Traces -->
  <g opacity="0.4">
    <g class="rotating-ring">
      <circle cx="1040" cy="60" r="110" stroke="#38BDF8" stroke-width="1" fill="none" stroke-dasharray="8 4"/>
      <circle cx="1040" cy="60" r="75" stroke="#818CF8" stroke-width="1" fill="none"/>
      <circle cx="1040" cy="60" r="38" stroke="#22D3EE" stroke-width="1" fill="none"/>
    </g>
    <circle cx="1065" cy="105" r="5" fill="#22D3EE" class="glowing-dot"/>
    
    <circle cx="60" cy="100" r="100" stroke="#1E293B" stroke-width="1" fill="none"/>
    <circle cx="60" cy="100" r="60" stroke="#334155" stroke-width="1" fill="none"/>
    <circle cx="120" cy="110" r="4" fill="#38BDF8" class="glowing-dot"/>
  </g>

  <!-- Top Center Code Symbol & Accent Lines -->
  <g transform="translate(550, 52)" text-anchor="middle">
    <line x1="-160" y1="0" x2="-50" y2="0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-160" cy="0" r="4" fill="#38BDF8" class="glowing-dot"/>
    <text x="0" y="8" class="symbol-text" text-anchor="middle">&lt;/&gt;</text>
    <line x1="50" y1="0" x2="160" y2="0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="160" cy="0" r="4" fill="#22D3EE" class="glowing-dot"/>
  </g>

  <!-- Expanded Main Title: PARTH KHOWAL -->
  <g transform="translate(550, 150)" text-anchor="middle">
    <text x="0" y="0">
      <tspan class="title-parth">PARTH </tspan>
      <tspan class="title-khowal">KHOWAL</tspan>
    </text>
  </g>

  <!-- Accent Lines under Name -->
  <g transform="translate(550, 178)">
    <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
    <line x1="-70" y1="0" x2="-16" y2="0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="0" x2="70" y2="0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 🌊 Continuous Animated Layered Waves Background -->
  <g transform="translate(0, 180)">
    <!-- Background Wave Mesh Lines & Pulsing Nodes -->
    <g stroke="#38BDF8" stroke-width="0.75" opacity="0.3" fill="none" class="wave-layer-3">
      <path d="M-200 20 Q 150 5 500 25 T 1100 15 T 1500 20"/>
      <path d="M-200 30 Q 250 10 600 35 T 1200 20 T 1500 30"/>
      <circle cx="150" cy="20" r="3.5" fill="#38BDF8" class="glowing-dot"/>
      <circle cx="520" cy="25" r="4" fill="#818CF8" class="glowing-dot"/>
      <circle cx="800" cy="18" r="3.5" fill="#22D3EE" class="glowing-dot"/>
    </g>

    <!-- Wave Layer 3 (Deepest) -->
    <path class="wave-layer-3" d="M-200,20 C100,-5 350,40 600,15 C850,-15 1050,30 1400,10 L1400,120 L-200,120 Z" fill="url(#waveGrad3Dark)"/>

    <!-- Wave Layer 2 (Middle) -->
    <path class="wave-layer-2" d="M-200,30 C150,0 400,50 650,20 C900,-10 1050,40 1400,15 L1400,120 L-200,120 Z" fill="url(#waveGrad2Dark)"/>

    <!-- Wave Layer 1 (Foreground Main Wave) -->
    <path class="wave-layer-1" d="M-200,45 C200,15 480,60 750,30 C950,0 1150,45 1400,25 L1400,120 L-200,120 Z" fill="url(#waveGrad1Dark)"/>
  </g>

  <!-- Shimmer Highlight Sweep Across Canvas -->
  <rect class="shimmer-line" x="0" y="0" width="140" height="280" fill="url(#shimmerGradDark)" transform="skewX(-20)" style="mix-blend-mode: overlay; pointer-events: none;"/>

</svg>
