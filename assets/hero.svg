<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240">
  <defs>
    <!-- Font Imports & Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;700;800&amp;display=swap');

      .title-parth {
        font-family: 'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 64px;
        fill: #0F172A;
        letter-spacing: -1.2px;
      }

      .title-khowal {
        font-family: 'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 64px;
        fill: url(#khowalGradient);
        letter-spacing: -1.2px;
      }

      /* 🌟 Smooth Continuous Wave Animations */
      .wave-layer-1 {
        animation: flowWave1 14s linear infinite;
      }
      .wave-layer-2 {
        animation: flowWave2 20s linear infinite;
      }
      .wave-layer-3 {
        animation: flowWave3 26s linear infinite;
      }

      @keyframes flowWave1 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-100px); }
        100% { transform: translateX(0px); }
      }
      @keyframes flowWave2 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(120px); }
        100% { transform: translateX(0px); }
      }
      @keyframes flowWave3 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-140px); }
        100% { transform: translateX(0px); }
      }

      /* Rotating Background Circuit Rings */
      .rotating-ring {
        transform-origin: 1040px 50px;
        animation: spinRing 32s linear infinite;
      }
      @keyframes spinRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Glowing / Pulsing Sparkles */
      .glowing-dot {
        animation: pulseDot 3s ease-in-out infinite alternate;
      }
      @keyframes pulseDot {
        0% { opacity: 0.35; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.3); }
      }

      /* Shimmer Highlight Sweep */
      .shimmer-line {
        animation: shimmerSweep 6s linear infinite;
      }
      @keyframes shimmerSweep {
        0% { transform: translateX(-450px); }
        100% { transform: translateX(1300px); }
      }
    </style>

    <!-- Light Shade Background Gradient -->
    <linearGradient id="bgLightShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="50%" style="stop-color:#F1F5F9"/>
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:0.6"/>
    </linearGradient>

    <!-- Gradients -->
    <linearGradient id="khowalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="40%" style="stop-color:#6366F1"/>
      <stop offset="75%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>

    <linearGradient id="blueOrbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.75"/>
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:0.9"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1D4ED8;stop-opacity:0.95"/>
      <stop offset="35%" style="stop-color:#4338CA;stop-opacity:0.9"/>
      <stop offset="70%" style="stop-color:#6D28D9;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:0.9"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.55"/>
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#67E8F9;stop-opacity:0.35"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dots Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#94A3B8" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Soft Light Shade Canvas Background -->
  <rect width="1100" height="240" fill="url(#bgLightShade)" rx="20" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Background Grid Patterns -->
  <rect x="24" y="20" width="130" height="100" fill="url(#dotGrid)" opacity="0.75"/>
  <rect x="980" y="20" width="90" height="100" fill="url(#dotGrid)" opacity="0.75"/>

  <!-- Left Side Glowing Blue Orb -->
  <circle cx="-15" cy="100" r="75" fill="url(#blueOrbGrad)" filter="url(#orbGlow)"/>

  <!-- Top Right Rotating Concentric Rings & Circuit Traces -->
  <g opacity="0.35">
    <g class="rotating-ring">
      <circle cx="1040" cy="50" r="110" stroke="#3B82F6" stroke-width="1" fill="none" stroke-dasharray="8 4"/>
      <circle cx="1040" cy="50" r="75" stroke="#8B5CF6" stroke-width="1" fill="none"/>
      <circle cx="1040" cy="50" r="38" stroke="#06B6D4" stroke-width="1" fill="none"/>
    </g>
    <circle cx="1065" cy="95" r="5" fill="#06B6D4" class="glowing-dot"/>
    
    <circle cx="60" cy="90" r="100" stroke="#CBD5E1" stroke-width="1" fill="none"/>
    <circle cx="60" cy="90" r="60" stroke="#E2E8F0" stroke-width="1" fill="none"/>
    <circle cx="120" cy="100" r="4" fill="#3B82F6" class="glowing-dot"/>
  </g>

  <!-- Top Center Code Symbol & Accent Lines -->
  <g transform="translate(550, 48)" text-anchor="middle">
    <line x1="-140" y1="0" x2="-45" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-140" cy="0" r="3.5" fill="#3B82F6"/>
    <text x="0" y="7" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#3B82F6" text-anchor="middle">&lt;/&gt;</text>
    <line x1="45" y1="0" x2="140" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="140" cy="0" r="3.5" fill="#06B6D4"/>
  </g>

  <!-- Main Title: PARTH KHOWAL -->
  <g transform="translate(550, 130)" text-anchor="middle">
    <text x="0" y="0">
      <tspan class="title-parth">PARTH </tspan>
      <tspan class="title-khowal">KHOWAL</tspan>
    </text>
  </g>

  <!-- Accent Lines under Name -->
  <g transform="translate(550, 152)">
    <circle cx="0" cy="0" r="3.5" fill="#3B82F6"/>
    <line x1="-50" y1="0" x2="-12" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="50" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 🌊 Continuous Animated Layered Waves Background -->
  <g transform="translate(0, 155)">
    <!-- Background Wave Mesh Lines & Pulsing Nodes -->
    <g stroke="#93C5FD" stroke-width="0.75" opacity="0.35" fill="none" class="wave-layer-3">
      <path d="M-200 20 Q 150 5 500 25 T 1100 15 T 1500 20"/>
      <path d="M-200 30 Q 250 10 600 35 T 1200 20 T 1500 30"/>
      <circle cx="150" cy="20" r="3.5" fill="#3B82F6" class="glowing-dot"/>
      <circle cx="520" cy="25" r="4" fill="#8B5CF6" class="glowing-dot"/>
      <circle cx="800" cy="18" r="3.5" fill="#06B6D4" class="glowing-dot"/>
    </g>

    <!-- Wave Layer 3 (Deepest) -->
    <path class="wave-layer-3" d="M-200,20 C100,-5 350,40 600,15 C850,-15 1050,30 1400,10 L1400,100 L-200,100 Z" fill="url(#waveGrad3)"/>

    <!-- Wave Layer 2 (Middle) -->
    <path class="wave-layer-2" d="M-200,50 C150,0 400,50 650,20 C900,-10 1050,40 1400,15 L1400,100 L-200,100 Z" fill="url(#waveGrad2)"/>

    <!-- Wave Layer 1 (Foreground Main Wave) -->
    <path class="wave-layer-1" d="M-200,45 C200,15 480,60 750,30 C950,0 1150,45 1400,25 L1400,100 L-200,100 Z" fill="url(#waveGrad1)"/>
  </g>

  <!-- Shimmer Highlight Sweep Across Canvas -->
  <rect class="shimmer-line" x="0" y="0" width="130" height="240" fill="url(#shimmerGrad)" transform="skewX(-20)" style="mix-blend-mode: overlay; pointer-events: none;"/>

</svg>
