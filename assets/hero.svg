<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <defs>
    <!-- Font Imports & Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');

      .title-parth {
        font-family: 'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 76px;
        fill: #0F172A;
        letter-spacing: -1px;
      }

      .title-khowal {
        font-family: 'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 76px;
        fill: url(#khowalGradient);
        letter-spacing: -1px;
      }

      .subtitle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 22px;
        fill: #334155;
      }

      .card-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #1E293B;
        letter-spacing: 0.8px;
      }

      .contact-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #334155;
      }

      /* 🌟 Smooth Continuous Wave Animations */
      .wave-layer-1 {
        animation: flowWave1 12s linear infinite;
      }
      .wave-layer-2 {
        animation: flowWave2 18s linear infinite;
      }
      .wave-layer-3 {
        animation: flowWave3 24s linear infinite;
      }

      @keyframes flowWave1 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-80px); }
        100% { transform: translateX(0px); }
      }
      @keyframes flowWave2 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(100px); }
        100% { transform: translateX(0px); }
      }
      @keyframes flowWave3 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-120px); }
        100% { transform: translateX(0px); }
      }

      /* Floating Action Cards */
      .floating-card {
        animation: cardFloat 5s ease-in-out infinite alternate;
      }

      .card-1 { animation-delay: 0s; }
      .card-2 { animation-delay: 0.7s; }
      .card-3 { animation-delay: 1.4s; }
      .card-4 { animation-delay: 2.1s; }
      .card-5 { animation-delay: 2.8s; }

      @keyframes cardFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }

      /* Glowing / Pulsing Sparkles */
      .glowing-dot {
        animation: pulseDot 3s ease-in-out infinite alternate;
      }
      @keyframes pulseDot {
        0% { opacity: 0.3; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.2); }
      }

      /* Shimmer Highlight Sweep */
      .shimmer-line {
        animation: shimmerSweep 6s linear infinite;
      }
      @keyframes shimmerSweep {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(1200px); }
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="khowalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="40%" style="stop-color:#6366F1"/>
      <stop offset="75%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1D4ED8;stop-opacity:0.95"/>
      <stop offset="35%" style="stop-color:#4338CA;stop-opacity:0.9"/>
      <stop offset="70%" style="stop-color:#6D28D9;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:0.9"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.55"/>
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#67E8F9;stop-opacity:0.35"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748B" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#475569" flood-opacity="0.10"/>
    </filter>

    <!-- Dots Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#94A3B8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="640" fill="#F8FAFC" rx="16"/>

  <!-- Background Grid Patterns -->
  <rect x="24" y="24" width="120" height="96" fill="url(#dotGrid)" opacity="0.7"/>
  <rect x="886" y="260" width="90" height="112" fill="url(#dotGrid)" opacity="0.7"/>

  <!-- Top Right & Top Left Background Circles -->
  <g opacity="0.35">
    <circle cx="940" cy="60" r="120" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <circle cx="940" cy="60" r="80" stroke="#8B5CF6" stroke-width="1" fill="none"/>
    <circle cx="940" cy="60" r="40" stroke="#06B6D4" stroke-width="1" fill="none"/>
    <circle cx="965" cy="110" r="5" fill="#06B6D4" class="glowing-dot"/>
    
    <circle cx="60" cy="220" r="140" stroke="#CBD5E1" stroke-width="1" fill="none"/>
    <circle cx="60" cy="220" r="90" stroke="#E2E8F0" stroke-width="1" fill="none"/>
    <circle cx="125" cy="245" r="4" fill="#3B82F6" class="glowing-dot"/>
  </g>

  <!-- Top Center Code Symbol & Lines -->
  <g transform="translate(500, 72)" text-anchor="middle">
    <line x1="-120" y1="0" x2="-40" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#3B82F6" text-anchor="middle">&lt;/&gt;</text>
    <line x1="40" y1="0" x2="120" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Main Title: PARTH KHOWAL -->
  <g transform="translate(500, 165)" text-anchor="middle">
    <text x="0" y="0">
      <tspan class="title-parth">PARTH </tspan>
      <tspan class="title-khowal">KHOWAL</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(500, 212)" text-anchor="middle">
    <text x="0" y="0" class="subtitle">
      Building intelligent solutions with <tspan font-weight="700" fill="#6366F1">AI</tspan>, <tspan font-weight="700" fill="#2563EB">data</tspan> and <tspan font-weight="700" fill="#0D9488">code</tspan>.
    </text>
  </g>

  <!-- Small Accent Dot under Subtitle -->
  <circle cx="500" cy="236" r="3.5" fill="#3B82F6"/>
  <line x1="450" y1="236" x2="488" y2="236" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="512" y1="236" x2="550" y2="236" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 5 Action / Value Cards Row with Floating Animations -->
  <g transform="translate(60, 270)">
    
    <!-- Card 1: DEVELOP -->
    <g class="floating-card card-1" transform="translate(0, 0)">
      <rect width="160" height="120" rx="18" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(80, 42)">
        <circle cx="0" cy="0" r="22" fill="#EFF6FF"/>
        <path d="M-7 -4 L-12 0 L-7 4 M7 -4 L12 0 L7 4 M-2 6 L2 -6" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="80" y="88" text-anchor="middle" class="card-title">DEVELOP</text>
      <rect x="68" y="96" width="24" height="3" rx="1.5" fill="#2563EB"/>
    </g>

    <!-- Card 2: LEARN -->
    <g class="floating-card card-2" transform="translate(180, 0)">
      <rect width="160" height="120" rx="18" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(80, 42)">
        <circle cx="0" cy="0" r="22" fill="#EEF2FF"/>
        <path d="M-10 -6 C-6 -8 0 -6 0 -6 C0 -6 6 -8 10 -6 L10 7 C6 5 0 7 0 7 C0 7 -6 5 -10 7 Z M0 -6 L0 7" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="80" y="88" text-anchor="middle" class="card-title">LEARN</text>
      <rect x="68" y="96" width="24" height="3" rx="1.5" fill="#4F46E5"/>
    </g>

    <!-- Card 3: ANALYZE -->
    <g class="floating-card card-3" transform="translate(360, 0)">
      <rect width="160" height="120" rx="18" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(80, 42)">
        <circle cx="0" cy="0" r="22" fill="#F0F9FF"/>
        <path d="M-10 8 L-10 3 M-4 8 L-4 -4 M2 8 L2 0 M8 8 L8 -8 M-10 1 L-4 -5 L2 -1 L9 -9" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="9" cy="-9" r="2" fill="#0284C7"/>
      </g>
      <text x="80" y="88" text-anchor="middle" class="card-title">ANALYZE</text>
      <rect x="68" y="96" width="24" height="3" rx="1.5" fill="#0284C7"/>
    </g>

    <!-- Card 4: INNOVATE -->
    <g class="floating-card card-4" transform="translate(540, 0)">
      <rect width="160" height="120" rx="18" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(80, 42)">
        <circle cx="0" cy="0" r="22" fill="#F5F3FF"/>
        <path d="M-7 -3 C-7 -7 -4 -10 0 -10 C4 -10 7 -7 7 -3 C7 0 4 2 3 5 L-3 5 C-4 2 -7 0 -7 -3 Z M-3 8 L3 8" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="0" y1="-14" x2="0" y2="-12" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <line x1="-11" y1="-3" x2="-9" y2="-3" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <line x1="9" y1="-3" x2="11" y2="-3" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="80" y="88" text-anchor="middle" class="card-title">INNOVATE</text>
      <rect x="68" y="96" width="24" height="3" rx="1.5" fill="#7C3AED"/>
    </g>

    <!-- Card 5: CREATE IMPACT -->
    <g class="floating-card card-5" transform="translate(720, 0)">
      <rect width="160" height="120" rx="18" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(80, 42)">
        <circle cx="0" cy="0" r="22" fill="#ECFEFF"/>
        <path d="M-2 9 C-2 9 -8 6 -9 2 C-9 -2 -4 -8 4 -10 C6 -2 2 8 -2 9 Z M-6 4 C-4 8 2 9 2 9 M-5 -3 C-3 -3 -3 -5 -5 -3" stroke="#06B6D4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="0" cy="-4" r="2" stroke="#06B6D4" stroke-width="2" fill="none"/>
      </g>
      <text x="80" y="88" text-anchor="middle" class="card-title">CREATE IMPACT</text>
      <rect x="68" y="96" width="24" height="3" rx="1.5" fill="#06B6D4"/>
    </g>

  </g>

  <!-- Contact Pill Bar Container -->
  <g transform="translate(500, 450)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#FFFFFF" filter="url(#pillShadow)"/>
    
    <!-- Item 1: LinkedIn -->
    <g transform="translate(-160, 0)">
      <rect x="-42" y="-11" width="22" height="22" rx="4" fill="#0A66C2"/>
      <text x="-34" y="4" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">in</text>
      <text x="-12" y="5" class="contact-text">/parth-khowal</text>
    </g>

    <line x1="-50" y1="-12" x2="-50" y2="12" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Item 2: Email -->
    <g transform="translate(-30, 0)">
      <rect x="-5" y="-10" width="20" height="15" rx="3" fill="none" stroke="#6366F1" stroke-width="2"/>
      <path d="M-5 -7 L5 0 L15 -7" stroke="#6366F1" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="24" y="5" class="contact-text">parthkhowal222@gmail.com</text>
    </g>

    <line x1="130" y1="-12" x2="130" y2="12" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Item 3: GitHub -->
    <g transform="translate(175, 0)">
      <circle cx="-12" cy="0" r="10" fill="#0F172A"/>
      <path d="M-16 2 C-16 -1 -14 -4 -12 -4 C-10 -4 -8 -1 -8 2 C-8 4 -9 6 -12 6 C-15 6 -16 4 -16 2 Z M-14 -1 C-14 -1 -13 -2 -12 -2 C-11 -2 -10 -1 -10 -1" fill="#FFFFFF"/>
      <text x="4" y="5" class="contact-text">/ParthK0</text>
    </g>
  </g>

  <!-- 🌊 Continuous Animated Layered Waves Background -->
  <g transform="translate(0, 480)">
    
    <!-- Background Wave Mesh Lines -->
    <g stroke="#93C5FD" stroke-width="0.75" opacity="0.3" fill="none" class="wave-layer-3">
      <path d="M-200 60 Q 100 20 400 70 T 1000 40 T 1400 60"/>
      <path d="M-200 80 Q 200 40 500 90 T 1100 60 T 1400 80"/>
      <path d="M-200 100 Q 150 70 450 110 T 1050 80 T 1400 100"/>
      <circle cx="120" cy="65" r="3.5" fill="#3B82F6" class="glowing-dot"/>
      <circle cx="450" cy="85" r="4" fill="#8B5CF6" class="glowing-dot"/>
      <circle cx="820" cy="55" r="3.5" fill="#06B6D4" class="glowing-dot"/>
    </g>

    <!-- Wave Layer 3 (Deepest / Lightest) -->
    <path class="wave-layer-3" d="M-200,50 C50,10 250,90 500,40 C750,-10 950,70 1200,30 L1200,160 L-200,160 Z" fill="url(#waveGrad3)"/>

    <!-- Wave Layer 2 (Middle Layer) -->
    <path class="wave-layer-2" d="M-200,70 C100,20 300,100 550,50 C800,0 950,85 1200,45 L1200,160 L-200,160 Z" fill="url(#waveGrad2)"/>

    <!-- Wave Layer 1 (Foreground Main Wave) -->
    <path class="wave-layer-1" d="M-200,90 C150,40 380,120 650,65 C850,20 1000,90 1200,60 L1200,160 L-200,160 Z" fill="url(#waveGrad1)"/>

  </g>

  <!-- Shimmer Highlight Sweep Across Canvas -->
  <rect class="shimmer-line" x="0" y="0" width="120" height="640" fill="url(#shimmerGrad)" transform="skewX(-20)" style="mix-blend-mode: overlay; pointer-events: none;"/>

</svg>
